name: Lyrics preview (temporary)

on:
  push:
    branches: [feat/lyrics-lens]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        continue-on-error: true
        run: pnpm run check 2>&1 | tail -80
      - run: pnpm exec vite build --config preview/vite.config.ts
      - name: Publish build to a scratch branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd preview-dist
          git init -q
          git checkout -q -b tmp/lyrics-preview
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "preview ${{ github.sha }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:tmp/lyrics-preview

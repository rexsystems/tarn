name: Mobile

# Best-effort Android / iOS builds. Failures do not block desktop releases.
# Trigger manually, or after a GitHub Release is published.

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  android:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf # v4.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev pkg-config libdbus-1-dev libasound2-dev

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Init and build APK
        run: |
          if [ -z "${NDK_HOME:-}" ]; then
            export NDK_HOME="${ANDROID_NDK_HOME:-}"
          fi
          if [ -z "${NDK_HOME:-}" ] && [ -d "${ANDROID_SDK_ROOT:-}/ndk" ]; then
            ver=$(ls -1 "$ANDROID_SDK_ROOT/ndk" | tail -1)
            [ -n "$ver" ] && export NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ver"
          fi
          echo "NDK_HOME=${NDK_HOME:-unset}"
          npx tauri android init --ci || npx tauri android init
          npx tauri android build --apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: tarn-android-apk
          path: |
            src-tauri/gen/android/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to release
        if: success() && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(src-tauri/gen/android/**/*.apk)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
          fi

  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Init and build (unsigned)
        run: |
          npx tauri ios init --ci || npx tauri ios init
          npx tauri ios build --debug --no-codesign \
            || npx tauri ios build --debug

      - name: Upload iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: tarn-ios
          path: |
            src-tauri/gen/apple/**/*.app
            src-tauri/gen/apple/**/*.ipa
          if-no-files-found: warn

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: --bundles deb,rpm,appimage
            os: linux
          - platform: ubuntu-24.04-arm
            args: --bundles deb,rpm,appimage
            os: linux
          - platform: windows-latest
            args: --bundles nsis,msi
            os: windows
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            os: macos
            rust_target: aarch64-apple-darwin
          - platform: macos-13
            args: --target x86_64-apple-darwin --bundles dmg
            os: macos
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: install linux deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config libdbus-1-dev rpm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tarn ${{ github.ref_name }}
          releaseBody: |
            Desktop packages for this tag are attached below.

            Playback needs [ffmpeg](https://ffmpeg.org/) and [yt-dlp](https://github.com/yt-dlp/yt-dlp) on your PATH (the Linux packages declare them as dependencies).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: install linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev pkg-config libdbus-1-dev
      - run: npm ci
      - name: init and build apk
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          npx tauri android init --ci || npx tauri android init
          npx tauri android build --apk --debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tarn-android-apk
          path: |
            src-tauri/gen/android/**/*.apk
          if-no-files-found: warn
      - name: attach apk to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(src-tauri/gen/android/**/*.apk)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
          fi

  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: npm ci
      - name: init and build (unsigned)
        run: |
          npx tauri ios init --ci || npx tauri ios init
          # Unsigned / no codesign — best effort. Failure is allowed.
          npx tauri ios build --debug --no-codesign \
            || npx tauri ios build --debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tarn-ios
          path: |
            src-tauri/gen/apple/**/*.app
            src-tauri/gen/apple/**/*.ipa
          if-no-files-found: warn

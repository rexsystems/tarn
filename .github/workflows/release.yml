name: Release

# Builds installable desktop apps and publishes GitHub Releases for downloads
# + Tauri updater latest.json. Runs on main (and manual dispatch).
#
# All third-party actions are pinned to a full commit SHA rather than a
# floating tag so a hijacked tag on the upstream action cannot silently
# execute new code with our TAURI_SIGNING_PRIVATE_KEY. Bumping a pin is a
# reviewable diff, not an invisible upgrade.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time so per-base build numbers stay unique.
concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write

# Publicly-safe values only. TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) is
# intentionally NOT in the top-level env - scoped per-step to build/sign
# steps so a compromised curl or npm script elsewhere cannot read it.
env:
  NODE_VERSION: "22"

jobs:
  # Allocate "<base>+<N>" once: N resets to 1 whenever tauri.conf version base changes.
  version:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.resolve.outputs.base }}
      build: ${{ steps.resolve.outputs.build }}
      stamped: ${{ steps.resolve.outputs.stamped }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Resolve per-base build number
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/resolve-release-build.mjs

  build-windows:
    needs: [version]
    runs-on: windows-2025
    env:
      VITE_TARN_BUILD: ${{ needs.version.outputs.build }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-windows
          cache-on-failure: true

      - name: Upgrade npm (optional native binding install fix)
        shell: bash
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Reinstall platform-native bindings
        # npm#4828: optional rollup/esbuild/cli binaries can be skipped
        shell: bash
        run: |
          npm install --no-save --force rollup esbuild @tauri-apps/cli
          node -e "require('rollup'); require('@tauri-apps/cli'); console.log('native bindings ok')"

      - name: Stamp release version
        shell: bash
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Tarn (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:ci -- --bundles nsis,msi

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        shell: bash
        run: |
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            src-tauri/target/release/bundle \
            windows-x86_64 \
            src-tauri/target/release/bundle/latest-fragment.json

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/latest-fragment.json

  build-linux:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            platform_key: linux-x86_64
            artifact_name: linux-x64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            platform_key: linux-aarch64
            artifact_name: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      VITE_TARN_BUILD: ${{ needs.version.outputs.build }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.platform_key }}
          cache-on-failure: true

      - name: Verify native build architecture
        env:
          EXPECTED_TARGET: ${{ matrix.rust_target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libasound2-dev \
            build-essential \
            curl \
            wget \
            file \
            cmake \
            clang \
            libclang-dev \
            rpm \
            libfuse2

      - name: Upgrade npm (optional native binding install fix)
        # npm < 11.3 can skip platform optionalDeps (npm/cli#4828), which breaks
        # @tauri-apps/cli / rollup / esbuild on linux-arm64 runners.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Reinstall platform-native bindings
        run: |
          npm install --no-save --force rollup esbuild @tauri-apps/cli
          arch="$(uname -m)"
          case "$arch" in
            aarch64|arm64)
              npm install --no-save --force \
                @tauri-apps/cli-linux-arm64-gnu \
                @rollup/rollup-linux-arm64-gnu \
                @esbuild/linux-arm64
              ;;
            x86_64|amd64)
              npm install --no-save --force \
                @tauri-apps/cli-linux-x64-gnu \
                @rollup/rollup-linux-x64-gnu \
                @esbuild/linux-x64
              ;;
            *)
              echo "Unknown arch: $arch" >&2
              exit 1
              ;;
          esac
          node -e "require('rollup'); require('@tauri-apps/cli'); console.log('native bindings ok')"

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Tarn (deb + rpm + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:linux:ci

      - name: Sign Linux package updaters
        # createUpdaterArtifacts signs AppImage; rpm/deb need an explicit sign for
        # linux-*-rpm / linux-*-deb keys used by installed packages.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for pkg in \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/deb/*.deb
          do
            if [ ! -f "${pkg}.sig" ]; then
              echo "Signing $pkg"
              npm exec -- tauri signer sign "$pkg"
            else
              echo "Already signed: $pkg"
            fi
          done

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        run: |
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            src-tauri/target/release/bundle \
            "${{ matrix.platform_key }}" \
            src-tauri/target/release/bundle/latest-fragment.json

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/latest-fragment.json

  build-macos:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            platform_key: darwin-aarch64
            artifact_name: macos-arm64
          - rust_target: x86_64-apple-darwin
            platform_key: darwin-x86_64
            artifact_name: macos-x64
    runs-on: macos-15
    env:
      VITE_TARN_BUILD: ${{ needs.version.outputs.build }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-macos-${{ matrix.rust_target }}
          cache-on-failure: true

      - name: Upgrade npm (optional native binding install fix)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Reinstall platform-native bindings
        run: |
          npm install --no-save --force rollup esbuild @tauri-apps/cli
          node -e "require('rollup'); require('@tauri-apps/cli'); console.log('native bindings ok')"

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Tarn (macOS .app)
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:macos:ci -- --target ${{ matrix.rust_target }}

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ARCH_SUFFIX="${{ matrix.rust_target }}"
          ARCH_SUFFIX="${ARCH_SUFFIX/-apple-darwin/}"
          echo "arch_suffix=$ARCH_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        run: |
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          if [ ! -d "$BUNDLE/macos" ]; then
            BUNDLE="src-tauri/target/release/bundle"
          fi
          APP="$BUNDLE/macos/Tarn.app"
          DMG_DIR="$BUNDLE/dmg"
          mkdir -p "$DMG_DIR"
          DMG="$DMG_DIR/Tarn_${{ steps.meta.outputs.version }}_${{ steps.meta.outputs.arch_suffix }}.dmg"
          chmod +x .github/create-macos-dmg.sh
          .github/create-macos-dmg.sh "$APP" "$DMG" "Tarn"
          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        id: fragment
        run: |
          BUNDLE="${{ steps.dmg.outputs.bundle_dir }}"
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            "$BUNDLE" \
            ${{ matrix.platform_key }} \
            "$BUNDLE/latest-fragment.json"
          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ steps.fragment.outputs.bundle_dir }}/dmg/*.dmg
            ${{ steps.fragment.outputs.bundle_dir }}/macos/*.app.tar.gz
            ${{ steps.fragment.outputs.bundle_dir }}/macos/*.sig
            ${{ steps.fragment.outputs.bundle_dir }}/latest-fragment.json

  publish:
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Git tags avoid `+` (URL-unfriendly); app/manifest keep 0.1.4+1.
          echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "build=${{ needs.version.outputs.build }}" >> "$GITHUB_OUTPUT"

      - name: Merge updater manifest
        run: |
          node .github/merge-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            artifacts \
            artifacts/latest.json
          cat artifacts/latest.json

      - name: Prepare release files
        run: |
          mkdir -p release-gh
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \
          \) -exec cp -n {} release-gh/ \;
          cp artifacts/latest.json release-gh/latest.json
          echo "GH assets:"
          ls -la release-gh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Tarn v${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.build }})
          body: |
            Desktop packages for this build are attached below.

            Tarn is self-contained - you do not need to install ffmpeg, yt-dlp, or any other extra tools.

            Updater: `latest.json` on this release (also via `/releases/latest/download/latest.json`).
          generate_release_notes: true
          files: release-gh/*
          draft: false
          prerelease: false

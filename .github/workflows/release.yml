name: Release

# Builds installable desktop apps and publishes GitHub Releases for downloads
# + Tauri updater latest.json. Runs on main (and manual dispatch).
#
# Flow:
#   1. Resolve version / tag
#   2. Create a *draft* GitHub Release immediately
#   3. Build each OS/arch on its own native runner in parallel; each job
#      attaches installers to the draft as soon as they finish
#   4. Merge updater fragments → upload latest.json → undraft (full release)
#
# All third-party actions are pinned to a full commit SHA rather than a
# floating tag so a hijacked tag on the upstream action cannot silently
# execute new code with our TAURI_SIGNING_PRIVATE_KEY. Bumping a pin is a
# reviewable diff, not an invisible upgrade.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time so per-base build numbers stay unique.
concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write

# Publicly-safe values only. TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) is
# intentionally NOT in the top-level env - scoped per-step to build/sign
# steps so a compromised curl or install script elsewhere cannot read it.
env:
  NODE_VERSION: "22"

jobs:
  # Allocate "<base>+<N>" once: N resets to 1 whenever tauri.conf version base changes.
  version:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.resolve.outputs.base }}
      build: ${{ steps.resolve.outputs.build }}
      stamped: ${{ steps.resolve.outputs.stamped }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Resolve per-base build number
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/resolve-release-build.mjs

  # Draft release first so each build job can attach assets as soon as they finish.
  # Stays draft until publish uploads latest.json and undrafts. Updater clients
  # must not see /releases/latest until the merged manifest is present.
  create-draft:
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      # No checkout: this job only talks to the Releases API. Pass GH_REPO so
      # `gh` does not shell out to git (no .git here → "not a git repository").
      # Custom --notes already cover the release body; do not use --generate-notes.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          TITLE="Tarn v${{ needs.version.outputs.stamped }} (build ${{ needs.version.outputs.build }})"
          NOTES="$(cat <<'EOF'
          Desktop packages for this build are attached below as each platform finishes building.

          Tarn is self-contained - you do not need to install ffmpeg, yt-dlp, or any other extra tools.

          Updater: `latest.json` lands on this release when every desktop platform is done (also via `/releases/latest/download/latest.json` after publish).
          EOF
          )"
          # Strip YAML-block indentation from the heredoc body.
          NOTES="$(printf '%s\n' "$NOTES" | sed 's/^          //')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving as-is"
          else
            gh release create "$TAG" \
              --draft \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

  build-windows:
    needs: [version, create-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            platform_key: windows-x86_64
            artifact_name: windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      VITE_TARN_BUILD: ${{ needs.version.outputs.build }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.platform_key }}
          cache-on-failure: true

      - name: Verify native build architecture
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.rust_target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native bindings
        shell: bash
        # Vite 8 ships Rolldown (not Rollup); resolve it through vite under pnpm.
        run: >-
          node -e "const {createRequire}=require('module');
          const fromVite=createRequire(require.resolve('vite/package.json'));
          fromVite('rolldown'); fromVite('lightningcss');
          require('@tauri-apps/cli');
          console.log('native bindings ok')"

      - name: Stamp release version
        shell: bash
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Tarn (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run build:ci --target ${{ matrix.rust_target }} --bundles nsis,msi

      - name: Resolve bundle dir
        id: bundle
        shell: bash
        run: |
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          if [ ! -d "$BUNDLE/nsis" ] && [ ! -d "$BUNDLE/msi" ]; then
            BUNDLE="src-tauri/target/release/bundle"
          fi
          echo "dir=$BUNDLE" >> "$GITHUB_OUTPUT"
          test -d "$BUNDLE"

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        shell: bash
        run: |
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            "${{ steps.bundle.outputs.dir }}" \
            ${{ matrix.platform_key }} \
            "${{ steps.bundle.outputs.dir }}/latest-fragment.json"

      - name: Attach Windows packages to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          BUNDLE="${{ steps.bundle.outputs.dir }}"
          files=(
            "$BUNDLE"/nsis/*.exe
            "$BUNDLE"/nsis/*.nsis.zip
            "$BUNDLE"/nsis/*.sig
            "$BUNDLE"/msi/*.msi
            "$BUNDLE"/msi/*.sig
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows packages found under $BUNDLE"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ steps.bundle.outputs.dir }}/nsis/*.exe
            ${{ steps.bundle.outputs.dir }}/nsis/*.nsis.zip
            ${{ steps.bundle.outputs.dir }}/nsis/*.sig
            ${{ steps.bundle.outputs.dir }}/msi/*.msi
            ${{ steps.bundle.outputs.dir }}/msi/*.sig
            ${{ steps.bundle.outputs.dir }}/latest-fragment.json

  build-linux:
    needs: [version, create-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            platform_key: linux-x86_64
            artifact_name: linux-x64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            platform_key: linux-aarch64
            artifact_name: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      VITE_TARN_BUILD: ${{ needs.version.outputs.build }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.platform_key }}
          cache-on-failure: true

      - name: Verify native build architecture
        env:
          EXPECTED_TARGET: ${{ matrix.rust_target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libasound2-dev \
            build-essential \
            curl \
            wget \
            file \
            cmake \
            clang \
            libclang-dev \
            rpm \
            libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native bindings
        # Vite 8 ships Rolldown (not Rollup); resolve it through vite under pnpm.
        run: >-
          node -e "const {createRequire}=require('module');
          const fromVite=createRequire(require.resolve('vite/package.json'));
          fromVite('rolldown'); fromVite('lightningcss');
          require('@tauri-apps/cli');
          console.log('native bindings ok')"

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Tarn (deb + rpm + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run build:linux:ci

      - name: Sign Linux package updaters
        # createUpdaterArtifacts signs AppImage; rpm/deb need an explicit sign for
        # linux-*-rpm / linux-*-deb keys used by installed packages.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for pkg in \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/deb/*.deb
          do
            if [ ! -f "${pkg}.sig" ]; then
              echo "Signing $pkg"
              pnpm exec tauri signer sign "$pkg"
            else
              echo "Already signed: $pkg"
            fi
          done

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        run: |
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            src-tauri/target/release/bundle \
            "${{ matrix.platform_key }}" \
            src-tauri/target/release/bundle/latest-fragment.json

      - name: Attach Linux packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux packages found"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/latest-fragment.json

  build-macos:
    needs: [version, create-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            platform_key: darwin-aarch64
            artifact_name: macos-arm64
            runner: macos-15
          # Native Intel runner: free for public repos, separate queue from the M1 pool.
          - rust_target: x86_64-apple-darwin
            platform_key: darwin-x86_64
            artifact_name: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      VITE_TARN_BUILD: ${{ needs.version.outputs.build }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-macos-${{ matrix.rust_target }}
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native bindings
        # Vite 8 ships Rolldown (not Rollup); resolve it through vite under pnpm.
        run: >-
          node -e "const {createRequire}=require('module');
          const fromVite=createRequire(require.resolve('vite/package.json'));
          fromVite('rolldown'); fromVite('lightningcss');
          require('@tauri-apps/cli');
          console.log('native bindings ok')"

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Tarn (macOS .app)
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run build:macos:ci --target ${{ matrix.rust_target }}

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ARCH_SUFFIX="${{ matrix.rust_target }}"
          ARCH_SUFFIX="${ARCH_SUFFIX/-apple-darwin/}"
          echo "arch_suffix=$ARCH_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        run: |
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          if [ ! -d "$BUNDLE/macos" ]; then
            BUNDLE="src-tauri/target/release/bundle"
          fi
          APP="$BUNDLE/macos/Tarn.app"
          DMG_DIR="$BUNDLE/dmg"
          mkdir -p "$DMG_DIR"
          DMG="$DMG_DIR/Tarn_${{ steps.meta.outputs.version }}_${{ steps.meta.outputs.arch_suffix }}.dmg"
          chmod +x .github/create-macos-dmg.sh
          .github/create-macos-dmg.sh "$APP" "$DMG" "Tarn"
          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Give updater archives an arch-specific name
        run: |
          # x64 and arm64 both produce Tarn.app.tar.gz; on the release they
          # would overwrite each other (and race on upload).
          BUNDLE="${{ steps.dmg.outputs.bundle_dir }}"
          for f in "$BUNDLE"/macos/*.app.tar.gz; do
            [ -e "$f" ] || continue
            base="${f%.app.tar.gz}"
            new="${base}_${{ steps.meta.outputs.arch_suffix }}.app.tar.gz"
            mv "$f" "$new"
            [ -e "$f.sig" ] && mv "$f.sig" "$new.sig"
          done
          ls -la "$BUNDLE"/macos

      - name: Write updater fragment
        id: fragment
        run: |
          BUNDLE="${{ steps.dmg.outputs.bundle_dir }}"
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            "$BUNDLE" \
            ${{ matrix.platform_key }} \
            "$BUNDLE/latest-fragment.json"
          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Attach macOS packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          BUNDLE="${{ steps.fragment.outputs.bundle_dir }}"
          files=(
            "$BUNDLE"/dmg/*.dmg
            "$BUNDLE"/macos/*.app.tar.gz
            "$BUNDLE"/macos/*.sig
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS packages found under $BUNDLE"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ steps.fragment.outputs.bundle_dir }}/dmg/*.dmg
            ${{ steps.fragment.outputs.bundle_dir }}/macos/*.app.tar.gz
            ${{ steps.fragment.outputs.bundle_dir }}/macos/*.sig
            ${{ steps.fragment.outputs.bundle_dir }}/latest-fragment.json

  publish:
    needs: [version, create-draft, build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Git tags avoid `+` (URL-unfriendly); app/manifest keep 0.1.4+1.
          echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "build=${{ needs.version.outputs.build }}" >> "$GITHUB_OUTPUT"

      - name: Merge updater manifest
        run: |
          node .github/merge-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            artifacts \
            artifacts/latest.json
          cat artifacts/latest.json

      - name: Prepare release files
        run: |
          mkdir -p release-gh
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \
          \) -exec cp -n {} release-gh/ \;
          cp artifacts/latest.json release-gh/latest.json
          echo "GH assets:"
          ls -la release-gh

      - name: Upload latest.json and finalize release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          # Safety net: re-attach any packages that a build job missed (idempotent).
          shopt -s nullglob
          packages=(release-gh/*)
          files=()
          for f in "${packages[@]}"; do
            [ "$(basename "$f")" = "latest.json" ] && continue
            files+=("$f")
          done
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber
          fi
          gh release upload "$TAG" release-gh/latest.json --clobber
          NOTES="$(cat <<'EOF'
          Desktop packages for this build are attached below.

          Tarn is self-contained - you do not need to install ffmpeg, yt-dlp, or any other extra tools.

          Updater: `latest.json` on this release (also via `/releases/latest/download/latest.json`).
          EOF
          )"
          NOTES="$(printf '%s\n' "$NOTES" | sed 's/^          //')"
          gh release edit "$TAG" \
            --draft=false \
            --title "Tarn v${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.build }})" \
            --notes "$NOTES"
          echo "Published $TAG"
